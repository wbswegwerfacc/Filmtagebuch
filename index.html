<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filmtagebuch</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#15131C",
            surface: "#1F1B29",
            marquee: "#E8A33D",
            velvet: "#B23A48",
            paper: "#F1EDE4",
            muted: "#9C93A8",
          },
          fontFamily: {
            display: ['"Bebas Neue"', "sans-serif"],
            body: ['"Inter"', "sans-serif"],
          },
        },
      },
    };
  </script>
  <script src="config.js"></script>
  <script src="main.js" defer></script>
</head>
<body class="bg-ink text-paper font-body min-h-screen">

  <nav class="border-b border-white/10 bg-ink/95 backdrop-blur sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="font-display text-3xl tracking-wide">🎬 Filmtagebuch</a>
      <div class="flex gap-6 font-body text-sm">
        <a href="index.html" class="pb-1 border-b-2 border-marquee">Start</a>
        <a href="journal.html" class="pb-1 border-b-2 border-transparent text-muted hover:text-paper hover:border-marquee/50 transition-colors">Tagebuch</a>
      </div>
    </div>
  </nav>

  <section class="max-w-6xl mx-auto px-6 pt-12 pb-8">
    <p class="text-muted text-sm mb-2">Finde deinen nächsten Filmabend</p>
    <h1 class="font-display text-5xl md:text-6xl tracking-wide mb-8">Was läuft heute?</h1>
    <form id="search-form" class="flex gap-3 max-w-xl">
      <label for="search-input" class="sr-only">Filmtitel suchen</label>
      <input
        id="search-input"
        type="text"
        placeholder="Filmtitel suchen…"
        required
        class="flex-1 bg-surface border border-white/10 px-4 py-3 text-paper placeholder-muted focus:outline-none focus:border-marquee transition-colors"
      />
      <button type="submit" class="px-6 py-3 bg-marquee text-ink font-semibold hover:bg-marquee/90 transition-colors">
        Suchen
      </button>
    </form>
  </section>

  <section class="max-w-6xl mx-auto px-6 pb-16">
    <h2 class="font-display text-3xl tracking-wide mb-6">Beliebte Filme</h2>
    <div id="popular-movies" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <p class="text-muted text-sm col-span-full">Filme werden geladen …</p>
    </div>
  </section>

  <dialog id="search-dialog" class="backdrop:bg-ink/80 bg-surface text-paper border border-white/10 w-full max-w-lg p-0 max-h-[80vh]">
    <div class="p-6 flex items-center justify-between border-b border-white/10">
      <h2 class="font-display text-2xl tracking-wide">Suchergebnisse</h2>
      <button id="close-dialog" aria-label="Schließen" class="text-muted hover:text-paper text-xl leading-none">&times;</button>
    </div>
    <div id="search-results" class="p-6 space-y-4 overflow-y-auto max-h-[60vh]"></div>
  </dialog>

</body>
</html>
