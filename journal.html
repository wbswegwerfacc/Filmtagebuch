<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filmtagebuch – Mein Tagebuch</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#15131C",
            surface: "#1F1B29",
            marquee: "#E8A33D",
            velvet: "#B23A48",
            paper: "#F1EDE4",
            muted: "#9C93A8",
          },
          fontFamily: {
            display: ['"Bebas Neue"', "sans-serif"],
            body: ['"Inter"', "sans-serif"],

        },
      },
    };
  </script>
  <script src="journal.js" defer></script>

<body class="bg-ink text-paper font-body min-h-screen">

  <nav class="border-b border-white/10 bg-ink/95 backdrop-blur sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="font-display text-3xl tracking-wide">🎬 Filmtagebuch</a>
      <div class="flex gap-6 font-body text-sm">
        <a href="index.html" class="pb-1 border-b-2 border-transparent text-muted hover:text-paper hover:border-marquee/50 transition-colors">Start</a>
        <a href="journal.html" class="pb-1 border-b-2 border-marquee">Tagebuch</a>
      </div>
    </div>
  </nav>

  <section class="max-w-4xl mx-auto px-6 pt-12 pb-16">
    <p class="text-muted text-sm mb-2">Deine gemerkten Filme</p>
    <h1 class="font-display text-5xl md:text-6xl tracking-wide mb-10">Mein Filmtagebuch</h1>

  </section>

</html>
